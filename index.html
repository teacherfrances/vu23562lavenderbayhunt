<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#143F30">
<title>The Lavender Bay Hunt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,900,100&display=swap">
<style>
:root{
  --fs:28px;
  --green:#1E5B45; --dgreen:#143F30; --mid:#4F7F6A; --ochre:#D4A12A; --otext:#7A5A12;
  --wash:#E7EFEA; --tint:#F3F7F4; --owash:#FAF3E1; --ink:#26302C; --grey:#5E645D; --line:#D8D0C0;
  --white:#FFFFFF; --wrong:#B5503C; --wrongwash:#F6E3DE;
  --head:"Cooper Black","Cooper Std","Fraunces",Georgia,serif;
  --body:"Trebuchet MS","Segoe UI",Carlito,Tahoma,system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:var(--fs);-webkit-text-size-adjust:100%}
html,body{margin:0}
body{font-family:var(--body);color:var(--ink);background:var(--tint);line-height:1.4;padding-top:calc(2.4rem + env(safe-area-inset-top,0px));padding-bottom:calc(3.4rem + env(safe-area-inset-bottom,0px))}
body.menu-view{padding-bottom:1rem}
h1,h2,h3,.head{font-family:var(--head);font-weight:900;font-variation-settings:"SOFT" 100;margin:0;line-height:1.1}
button{font-family:var(--body);font-size:1rem;cursor:pointer;border:0;color:inherit;background:none}
button:focus-visible,summary:focus-visible{outline:4px solid var(--ochre);outline-offset:3px}
.hidden{display:none!important}
svg{display:block}
.ic{display:inline-grid;place-items:center;line-height:0}

/* top bar */
.top{position:fixed;top:0;left:0;right:0;z-index:20;background:var(--dgreen);color:var(--white);display:flex;align-items:center;gap:.35rem;padding:calc(.3rem + env(safe-area-inset-top,0px)) .5rem .3rem;min-height:2.4rem}
.top .tb{min-height:1.8rem;min-width:1.8rem;border-radius:.4rem;border:2px solid var(--mid);padding:.1rem .45rem;font-weight:bold;display:inline-flex;align-items:center;justify-content:center;gap:.3rem;color:var(--white)}
.top .tb.main{background:var(--ochre);border-color:var(--ochre);color:var(--ink)}
.top .ttl{flex:1;min-width:0;color:var(--ochre);font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 .3rem}
.top .saved{font-size:max(.62rem,19px);color:var(--owash);opacity:0;transition:opacity .3s;white-space:nowrap}
.top .saved.on{opacity:1}
@media (max-width:620px){.top .ttl{visibility:hidden}.top .saved{display:none}}

.szgrp{display:inline-flex;gap:0}
.top .szgrp .tb:first-child{border-top-right-radius:0;border-bottom-right-radius:0}
.top .szgrp .tb:last-child{border-top-left-radius:0;border-bottom-left-radius:0;border-left-width:0}
/* bottom bar */
.bot{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--white);border-top:3px solid var(--wash);display:flex;align-items:center;gap:.5rem;padding:.35rem .6rem calc(.35rem + env(safe-area-inset-bottom,0px))}
.bot .tip{flex:1;min-width:0;color:var(--grey);font-size:max(.68rem,19px);line-height:1.25}
.bot .nb{min-height:2.2rem;border-radius:2rem;padding:.2rem .9rem;font-weight:bold;background:var(--wash);color:var(--green);white-space:nowrap}
.bot .nb.wait{background:var(--owash);color:var(--otext);border:3px solid var(--ochre)}
.bot .nb.done{background:var(--green);color:var(--white)}
.bot .skip{background:none;color:var(--otext);text-decoration:underline;font-weight:bold;min-height:2rem}
@media (max-width:620px){.bot .tip{display:none}.bot{justify-content:space-between}}

main{max-width:980px;margin:0 auto;padding:.6rem .6rem 1rem}

/* hero */
.hero{background:var(--dgreen);color:var(--white);border-radius:0 0 1rem 1rem;margin:-.6rem -.6rem .8rem;padding:1rem 1rem 1.1rem;text-align:center}
.tag{display:inline-block;background:var(--ochre);color:var(--ink);font-weight:bold;padding:.1rem .6rem;border-radius:.3rem;font-size:max(.7rem,19px)}
.hero h1{font-size:2.1rem;margin:.4rem 0 .2rem}
.hero .sub{color:var(--owash);margin:0 0 .6rem}
.hero .lead{margin:.5rem auto 0;max-width:32rem}

/* route motif */
.route{position:relative;height:2rem;max-width:32rem;margin:0 auto}
.route .line{position:absolute;left:.5rem;right:.5rem;top:50%;height:.22rem;margin-top:-.11rem;background:var(--ochre);border-radius:.2rem}
.route .dots{position:absolute;left:0;right:0;top:50%;display:flex;justify-content:space-between;transform:translateY(-50%)}
.route .dot{width:1rem;height:1rem;border-radius:50%;background:var(--dgreen);border:.16rem solid var(--ochre)}
.route .dot.done{background:var(--ochre)}
.route .bus{position:absolute;top:50%;width:2rem;height:2rem;margin:-1rem 0 0 -1rem;border-radius:50%;background:var(--ochre);color:var(--dgreen);display:grid;place-items:center;font-size:1rem;left:1rem;transition:left .9s cubic-bezier(.5,0,.3,1)}

/* panels */
.panel{background:var(--white);border-radius:.8rem;padding:.8rem 1rem;margin:0 0 .8rem;border:2px solid var(--wash)}
.panel h2{color:var(--green);font-size:1.25rem;margin-bottom:.4rem}
.panel p{margin:.3rem 0}
.wb{background:var(--owash);border:3px solid var(--ochre)}
.wb h2{color:var(--otext)}
.warn{background:var(--owash);border-left:.3rem solid var(--ochre);border-radius:.5rem;padding:.5rem .8rem;margin:0 0 .8rem;color:var(--otext);font-weight:bold}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;min-height:2.2rem;border-radius:2rem;padding:.2rem 1rem;font-weight:bold;background:var(--wash);color:var(--green)}
.btn.main{background:var(--ochre);color:var(--ink)}
.btn.green{background:var(--green);color:var(--white)}
.btnrow{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.5rem}

/* trip card */
.trip{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap}
.trip .big{font-family:var(--head);font-weight:900;font-variation-settings:"SOFT" 100;color:var(--green);font-size:2rem}
.stars{display:flex;gap:.2rem;color:var(--line);font-size:1.2rem}
.stars .on{color:var(--ochre)}

/* stop timeline */
.stops{list-style:none;margin:0 0 .8rem;padding:0;position:relative}
.stops:before{content:"";position:absolute;left:1.05rem;top:.8rem;bottom:.8rem;width:.22rem;background:var(--ochre);border-radius:.2rem}
.stops li{position:relative;padding-left:2.7rem;margin-bottom:.55rem}
.stops .pin{position:absolute;left:.35rem;top:.75rem;width:1.6rem;height:1.6rem;border-radius:50%;background:var(--white);border:.2rem solid var(--ochre);display:grid;place-items:center;color:var(--white);font-size:.7rem}
.stops li.done .pin{background:var(--ochre);color:var(--dgreen)}
.stops li.here .pin{background:var(--ochre);color:var(--dgreen);width:2rem;height:2rem;left:.15rem;top:.55rem;font-size:1rem;box-shadow:0 0 0 .25rem rgba(212,161,42,.35)}
.mcard{width:100%;text-align:left;background:var(--white);border:3px solid var(--wash);border-radius:.8rem;padding:.55rem .8rem;display:block}
.mcard:hover{border-color:var(--mid)}
.stops li.here .mcard{border-color:var(--ochre)}
.mcard .step{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap;color:var(--mid);font-weight:bold;font-size:max(.68rem,19px)}
.mcard .step .badge{background:var(--green);color:var(--white);width:1.3rem;height:1.3rem;border-radius:50%;font-size:.65rem}
.mcard h3{color:var(--green);font-size:1.1rem;margin:.15rem 0}
.mcard .desc{margin:0;color:var(--ink)}
.pill{display:inline-block;margin-top:.3rem;border-radius:1rem;padding:.05rem .6rem;font-weight:bold;font-size:max(.68rem,19px);background:var(--owash);color:var(--otext)}
.pill.full{background:var(--green);color:var(--white)}

.tscroll{overflow-x:auto}
table.gt{border-collapse:collapse;width:100%;background:var(--white);font-size:max(.72rem,19px)}
table.gt th{background:var(--mid);color:var(--white);text-align:left;padding:.25rem .5rem}
table.gt td{border:1px solid var(--line);padding:.25rem .5rem;vertical-align:top}
.reset{text-align:center;margin:1rem 0}

/* part */
.rhead{background:var(--dgreen);color:var(--white);border-radius:.8rem;padding:.7rem .9rem;margin-bottom:.8rem}
.rhead .kick{color:var(--ochre);font-weight:bold;font-size:max(.7rem,19px);display:flex;gap:.4rem;align-items:center;flex-wrap:wrap}
.rhead .kick .badge{background:var(--ochre);color:var(--dgreen);width:1.4rem;height:1.4rem;border-radius:50%;font-size:.7rem}
.rhead h1{font-size:1.5rem;margin:.2rem 0}
.rhead p{margin:.2rem 0;color:var(--owash)}
.pbar{height:.4rem;border-radius:.2rem;background:rgba(255,255,255,.18);margin:.4rem 0 .3rem;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--ochre);transition:width .4s}
.live{font-weight:bold;font-size:max(.7rem,19px)}

.player{background:var(--white);border:3px solid var(--wash);border-radius:.8rem;padding:.6rem .8rem;margin-bottom:.8rem;display:flex;flex-wrap:wrap;align-items:center;gap:.5rem}
.player .lab{font-weight:bold;color:var(--green);flex:1 1 10rem}
.soon{background:var(--owash);border-left:.3rem solid var(--ochre);border-radius:.5rem;padding:.35rem .6rem;color:var(--otext);font-weight:bold;font-size:max(.72rem,19px);flex:1 1 100%}

.snip{background:var(--owash);border-radius:.8rem;padding:.6rem .8rem;margin-bottom:.8rem;border:2px solid #EADFC2}
.snip h4{font-family:var(--head);font-weight:900;font-variation-settings:"SOFT" 100;color:var(--otext);font-size:1.1rem;margin:0 0 .3rem}
.sign{background:var(--green);color:var(--white);border-radius:.6rem;padding:.6rem .8rem;max-width:24rem}
.sign .r{display:flex;align-items:center;gap:.5rem;font-family:var(--head);font-weight:900;font-variation-settings:"SOFT" 100;font-size:1.1rem}
.sign .r .ic{background:var(--ochre);color:var(--dgreen);width:1.6rem;height:1.6rem;border-radius:.3rem}
.sign p{margin:.25rem 0}
.sign .small{font-size:max(.68rem,19px);color:var(--owash)}
.snip .note{font-size:max(.68rem,19px);color:var(--otext);margin:.4rem 0 0}

.card{background:var(--white);border-radius:.8rem;border:3px solid var(--wash);border-left-width:.4rem;padding:.6rem .8rem .7rem;margin-bottom:.8rem;scroll-margin-top:3rem;scroll-margin-bottom:4rem}
.card.good{border-left-color:var(--green)}
.card.bad{border-left-color:var(--wrong)}
.card.flash{animation:flash 1.2s}
@keyframes flash{0%,100%{box-shadow:none}30%,70%{box-shadow:0 0 0 .3rem var(--ochre)}}
.chead{display:flex;align-items:center;gap:.5rem;margin-bottom:.3rem}
.num{background:var(--green);color:var(--white);min-width:1.5rem;height:1.5rem;border-radius:.3rem;display:grid;place-items:center;font-family:var(--head);font-weight:900;font-variation-settings:"SOFT" 100;font-size:.85rem;padding:0 .3rem}
.mark{font-weight:bold;font-size:max(.7rem,19px);display:inline-flex;align-items:center;gap:.25rem}
.mark.good{color:var(--green)} .mark.bad{color:var(--wrong)}
.q{font-weight:bold;margin:.2rem 0 .5rem}
.quote{background:var(--tint);border-left:.3rem solid var(--mid);border-radius:.5rem;padding:.4rem .7rem;margin:.2rem 0 .5rem;font-style:italic}
.opts{display:grid;gap:.45rem}
.opt{display:flex;align-items:center;gap:.6rem;text-align:left;background:var(--tint);border:3px solid var(--wash);border-radius:.7rem;padding:.4rem .6rem;min-height:2.3rem;font-weight:bold;width:100%}
.opt .k{flex:none;width:1.5rem;height:1.5rem;background:var(--green);color:var(--white);display:grid;place-items:center;border-radius:.25rem;font-family:var(--head);font-weight:900;font-variation-settings:"SOFT" 100;font-size:.8rem}
.opt:hover:not(:disabled){border-color:var(--mid)}
.opt:disabled{cursor:default}
.opt.right{background:var(--green);border-color:var(--green);color:var(--white)}
.opt.right .k{background:var(--white);color:var(--green)}
.opt.wrong{background:var(--wrongwash);border-color:var(--wrong);color:var(--wrong)}
.opt.wrong .k{background:var(--wrong)}
.opt.dim{opacity:.55}

.say{display:flex;align-items:center;gap:.4rem;color:var(--otext);font-weight:bold;font-size:max(.7rem,19px);margin-bottom:.3rem}
.say .ic{background:var(--ochre);color:var(--white);width:1.3rem;height:1.3rem;border-radius:50%;font-size:.6rem}
.syls{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.syl{min-width:2.4rem;min-height:2.4rem;padding:.2rem .6rem;border-radius:.6rem;background:var(--tint);border:3px solid var(--wash);font-weight:bold;font-size:1.15rem}
.syl:hover:not(:disabled){border-color:var(--mid)}
.syl.right{background:var(--green);border-color:var(--green);color:var(--white);text-transform:uppercase}
.syl.wrong{background:var(--wrongwash);border-color:var(--wrong);color:var(--wrong)}
.syls .gap{width:.6rem}

.slot{min-height:2.6rem;border:3px dashed var(--mid);border-radius:.7rem;background:var(--tint);padding:.3rem;display:flex;flex-wrap:wrap;gap:.3rem;align-items:center;margin-bottom:.5rem}
.slot .phd{color:var(--grey);font-size:max(.7rem,19px);padding:0 .3rem}
.slot.good{border-style:solid;border-color:var(--green);background:var(--wash)}
.slot.bad{border-style:solid;border-color:var(--wrong);background:var(--wrongwash)}
.chip{min-height:2.2rem;border-radius:.6rem;padding:.15rem .6rem;font-weight:bold;background:var(--owash);color:var(--otext);border:2px solid #EADFC2}
.slot .chip{background:var(--white);color:var(--green);border-color:var(--wash)}
.pool{display:flex;flex-wrap:wrap;gap:.4rem}
.mini{margin-top:.4rem;display:flex;gap:.4rem;flex-wrap:wrap}
.mini button{min-height:2rem;border-radius:2rem;padding:.1rem .7rem;font-weight:bold;background:var(--wash);color:var(--green);font-size:max(.75rem,19px)}

.bins{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.bin{min-height:2.6rem;border-radius:.7rem;font-weight:bold;display:flex;align-items:center;justify-content:center;gap:.4rem;border:3px solid var(--wash);background:var(--tint);padding:.3rem}
.bin:hover:not(:disabled){border-color:var(--mid)}
.bin.right{background:var(--green);color:var(--white);border-color:var(--green)}
.bin.wrong{background:var(--wrongwash);color:var(--wrong);border-color:var(--wrong)}
.bin.dim{opacity:.55}
.bin:disabled{cursor:default}

.fb{border-radius:.6rem;padding:.45rem .7rem;margin-top:.5rem}
.fb b{display:block}
.fb.good{background:var(--wash);color:var(--dgreen)}
.fb.bad{background:var(--wrongwash);color:#7A2F20}
.chg{margin-top:.4rem;min-height:2rem;border-radius:2rem;padding:.1rem .8rem;font-weight:bold;color:var(--green);border:2px solid var(--wash);font-size:max(.72rem,19px);display:inline-flex;align-items:center;gap:.3rem}

/* phone mock-ups */
.mock{margin:.2rem 0 .6rem;display:flex;align-items:center;gap:.8rem;flex-wrap:wrap}
.ph{width:7.2rem;height:9.4rem;border-radius:1rem;border:.3rem solid var(--ink);background:var(--white);overflow:hidden;position:relative;flex:none}
.ph .bar{height:1rem;background:var(--green);color:var(--white);font-size:.45rem;font-weight:bold;display:flex;align-items:center;padding:0 .3rem}
.ph .map{position:absolute;inset:1rem 0 0;background:#EEF0E8}
.ph .rd{position:absolute;background:#D6CEBD}
.ph .lbl{position:absolute;font-size:5px;color:#555}
.ph .pinm{position:absolute;width:.6rem;height:.6rem;border-radius:50% 50% 50% 0;background:var(--ochre);transform:rotate(-45deg)}
.ph .row{margin:.2rem .3rem 0;height:1.5rem;border-radius:.25rem;background:var(--tint);border:1px solid var(--wash);font-size:.4rem;padding:.1rem .25rem;color:var(--ink)}
.ph .fade{position:absolute;left:0;right:0;bottom:0;height:2.2rem;background:linear-gradient(transparent,var(--white))}
.ph .arrow{position:absolute;left:50%;bottom:.2rem;transform:translateX(-50%);color:var(--ochre);font-size:.8rem}
.cardm{width:9rem;height:5.6rem;border-radius:.6rem;background:linear-gradient(135deg,var(--dgreen),var(--mid));color:var(--white);padding:.4rem .5rem;position:relative;flex:none}
.cardm .t{font-weight:bold;font-size:.55rem}
.cardm .chipm{width:1.2rem;height:.9rem;background:var(--ochre);border-radius:.15rem;margin:.35rem 0}
.cardm .bal{font-family:var(--head);font-weight:900;font-variation-settings:"SOFT" 100;font-size:1rem}
.cardm .bal small{font-family:var(--body);font-size:.45rem;display:block;font-weight:bold}
.busm{width:9rem;height:5.6rem;border-radius:.6rem;background:var(--tint);border:2px solid var(--wash);position:relative;flex:none;color:var(--green);display:grid;place-items:center;font-size:2.6rem}
.busm .rd2{position:absolute;bottom:.4rem;right:.5rem;width:2rem;height:1.2rem;border-radius:.25rem;background:var(--ochre);color:var(--dgreen);font-size:.45rem;font-weight:bold;display:grid;place-items:center}
.mcap{flex:1 1 9rem;font-style:italic;color:var(--grey)}

/* summary, results */
.sum{background:var(--owash);border:3px solid var(--ochre);border-radius:.8rem;padding:.7rem .9rem;margin-bottom:.8rem}
.sum h2{color:var(--otext);font-size:1.3rem}
.dlg{width:100%;border-collapse:collapse;margin-top:.4rem;background:var(--white)}
.dlg td{border:1px solid var(--line);padding:.25rem .5rem;vertical-align:top}
.dlg td.who{background:var(--wash);color:var(--green);font-weight:bold;width:4.5rem}
.misschips{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.4rem}
.misschips button{min-height:2rem;border-radius:2rem;padding:.1rem .7rem;font-weight:bold;background:var(--wrongwash);color:var(--wrong);font-size:max(.75rem,19px)}
.res{text-align:center}
.res h1{color:var(--green);font-size:2.2rem;margin:.3rem 0}
.res .score{font-family:var(--head);font-weight:900;font-variation-settings:"SOFT" 100;color:var(--green);font-size:3rem}
.res .stars{justify-content:center;font-size:2rem}
.brk{display:grid;gap:.4rem;margin:.8rem 0;text-align:left}
.brk button{display:flex;align-items:center;gap:.6rem;background:var(--white);border:3px solid var(--wash);border-radius:.7rem;padding:.35rem .7rem;min-height:2.3rem;width:100%;text-align:left;font-weight:bold}
.brk button .p{margin-left:auto;color:var(--green);font-family:var(--head);font-weight:900;font-variation-settings:"SOFT" 100}
.brk button.full{border-color:var(--green)}

.toast{position:fixed;left:50%;bottom:4.2rem;transform:translateX(-50%) translateY(1rem);background:var(--ochre);color:var(--ink);font-weight:bold;border-radius:2rem;padding:.3rem 1rem;z-index:30;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;display:flex;gap:.4rem;align-items:center;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.jump{position:fixed;right:.6rem;bottom:4rem;z-index:25;background:var(--dgreen);color:var(--white);border-radius:2rem;padding:.2rem .8rem;min-height:2rem;font-weight:bold;font-size:max(.72rem,19px);box-shadow:0 4px 12px rgba(0,0,0,.25)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.confetti i{position:absolute;top:-5vh;width:12px;height:18px;border-radius:3px;animation:drop 3.2s ease-in forwards}
@keyframes drop{to{transform:translateY(110vh) rotate(540deg)}}
.opts{grid-template-columns:minmax(0,1fr)}
.opt,.bin,.chip,.syl,.mcard,.q,.quote,.fb,.lab{overflow-wrap:anywhere;min-width:0}
.bins{grid-template-columns:repeat(auto-fit,minmax(min(100%,7rem),1fr))}
.player .lab{flex:1 1 auto}
.cardm,.busm{max-width:100%}
.ph{max-width:46vw}
.bot .nb{white-space:normal;text-align:center;line-height:1.15}
@media (max-width:620px){.bot .nb .lng{display:none}}
@media (max-width:480px){.top{font-size:min(1rem,26px);gap:.25rem}.top button{font-size:inherit}.top .tb{padding:.05rem .3rem;min-width:1.5em;min-height:1.9em}.bot{font-size:min(1rem,28px)}.bot button{font-size:inherit}.bot .nb{padding:.2rem .6rem}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.confetti{display:none}}

/* ===== hunt additions ===== */
.camin{position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0}
.ctitle{color:var(--green);font-size:1.15rem;margin:0}
.chead{flex-wrap:wrap}
.chead .mark{margin-left:auto}
.find{display:flex;gap:.5rem;align-items:flex-start;background:var(--owash);border:2px solid #EADFC2;border-radius:.6rem;padding:.45rem .65rem;margin:.3rem 0 .5rem;color:var(--otext);font-weight:bold}
.find .ic{flex:none;margin-top:.2rem;color:var(--ochre)}
.shot{margin:0 0 .6rem}
.shot img{width:100%;max-height:15rem;object-fit:cover;border-radius:.6rem;border:3px solid var(--wash);display:block;background:var(--tint)}
.cams{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,8rem),1fr));gap:.45rem}

.tick.on{border-color:var(--green);background:var(--wash)}
.tick.on .bx{background:var(--green);border-color:var(--green)}
.tick:hover{border-color:var(--mid)}
.model{background:var(--tint);border-left:.3rem solid var(--mid);border-radius:.5rem;padding:.45rem .7rem;margin:.2rem 0 .6rem}

.words{display:flex;flex-wrap:wrap;gap:.3rem;margin:.3rem 0}

function storageOK() { try { localStorage.setItem("__t", "1"); localStorage.removeItem("__t"); return true; } catch (e) { return false; } }

    rq.onsuccess = function () { DB = rq.result; fin(true); };

}

/* ----- photos ----- */
function shrink(file, cb) {

    try {
      var max = 900, w = img.naturalWidth, hh = img.naturalHeight, sc = Math.min(1, max / Math.max(w, hh));
      var c = document.createElement("canvas"); c.width = Math.max(1, Math.round(w * sc)); c.height = Math.max(1, Math.round(hh * sc));
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      var out = c.toDataURL("image/jpeg", 0.62);
      URL.revokeObjectURL(url); cb(null, out);
    } catch (e) { URL.revokeObjectURL(url); cb("Canvas"); }
  };
  img.onerror = function () { URL.revokeObjectURL(url); cb("BadImage"); };
  img.src = url;
}

  shrink(f, function (err, data) {
    inp.value = "";

    savePhoto(k, data, function (ok) {
      stamp(k); save(true);
      if (S.v === "part" && +k.split(":")[0] === S.p) refreshCard(k);

    });

}

/* ----- show my teacher ----- */
function fmtTime(ms) { var d = new Date(ms), h = d.getHours(), m = d.getMinutes(); return (h % 12 || 12) + ":" + (m < 10 ? "0" : "") + m + (h < 12 ? " am" : " pm"); }

function answerText(k) {

  if (it.t === "mcq") { var a = S.a[k]; if (!a) return {txt: "No answer yet", cls: "no"}; var txt = a.txt || (S.o[k] ? it.opts[S.o[k][a.pick]] : ""); return {txt: txt, cls: a.ok ? "ok" : "bad", ok: a.ok}; }

}

    '<p class="pn">' + (S.name ? esc(S.name) : "Name not chosen") + ' <button class="nmchg" data-act="who">Change</button></p>' +
    '<p class="pd">' + (S.fin ? "Finished at " + fmtTime(S.fin) + ", " + fmtDay(S.fin) : "Checked at " + fmtTime(Date.now()) + ", " + fmtDay(Date.now())) + "</p></div>";
  h += countsHTML(t);

    h += '<li class="' + (dn ? "dn" : "nd") + '">' + (ph ? '<img src="' + ph + '" alt="">' : '<span class="noimg">No photo</span>') +

      '<span class="pt2">' + (dn ? ic("FaCheck") + "Done" + (S.ts[k] ? " at " + fmtTime(S.ts[k]) : "") : (ph ? "Answer missing" : "Photo missing")) + "</span>" +

}
function makeSheet(btn) {
  var t = allDone(), keys = [];

  btn.disabled = true; btn.lastChild.textContent = "Making your picture...";

  var c = document.createElement("canvas"); c.width = W; c.height = top + rows * (th + cap + gap) + 30;

  x.fillStyle = "#143F30"; x.fillRect(0, 0, W, 220);
  x.fillStyle = "#D4A12A"; x.font = "bold 30px Trebuchet MS, Arial, sans-serif"; x.fillText("VU23562  The Lavender Bay Hunt", 30, 52);
  x.fillStyle = "#FFFFFF"; x.font = "bold 54px Trebuchet MS, Arial, sans-serif"; x.fillText(S.name || "Name not chosen", 30, 120);
  x.font = "30px Trebuchet MS, Arial, sans-serif";
  x.fillText(t.n + " of " + TOTAL + " tasks done   " + t.ph + " photos   " + t.r + " of " + MCQ + " answers right", 30, 168);
  x.fillStyle = "#FAF3E1"; x.font = "24px Trebuchet MS, Arial, sans-serif";
  x.fillText(S.fin ? "Finished at " + fmtTime(S.fin) + ", " + fmtDay(S.fin) : "Saved at " + fmtTime(Date.now()) + ", " + fmtDay(Date.now()), 30, 202);
  var n = 0;
  function wrap(txt, X, Y, maxW, lh, maxL) {
    var words = String(txt).split(" "), line = "", l = 0;

        if (file && navigator.canShare && navigator.canShare({files: [file]})) {

        } else {

/* ----- bottom bar and gated Next ----- */
function firstOpen(p) { for (var i = 0; i < STOPS[p].items.length; i++) if (!taskDone(p + ":" + i)) return i; return -1; }

  tip.textContent = STOPS[S.p].tip;

    jp.textContent = left + (left === 1 ? " task" : " tasks") + " left. Take me there"; jp.classList.toggle("hidden", d.n === 0 && d.ph === 0);
  } else { nb.className = "nb done"; nb.textContent = last ? "Finish" : "Next stop"; jp.classList.add("hidden"); }

}

$("nextBtn").onclick = next;
$("skipBtn").onclick = advance;
